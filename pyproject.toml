[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bangladesh-industrial-intelligence"
version = "0.4.0.dev0"
description = "Public software and methodology for Bangladesh Industrial Intelligence"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
